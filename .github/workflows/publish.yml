name: publish

# Publica el paquete en npm cuando se empuja un tag `vX.Y.Z`.
#
# Autenticación: OIDC (trusted publishing), sin tokens guardados. GitHub le da a
# este workflow una identidad efímera y npm la canjea por un credencial de
# publicación, así que no hay secreto que rotar ni que robar. Los tokens classic
# de npm —incluido el "Automation" que usaba este archivo— se revocaron en
# diciembre de 2025 y ya no son una opción.
#
# Antes del primer release, en npmjs.com:
#   Package → Settings → Trusted publishing → GitHub Actions, con
#     usuario:     GuidoMaxier
#     repositorio: dsh-locale-es
#     workflow:    publish.yml   (coincidencia exacta, con la extensión)
#     environment: (vacío)
#   Y después empujar el tag: `git tag v0.1.2 && git push origin v0.1.2`.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC: npm canjea este token por permiso de publicación

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sin `registry-url`: setup-node escribiría un _authToken vacío en .npmrc y
      # ese token vacío bloquea el canje OIDC (falla con ENEEDAUTH).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # El OIDC necesita npm >= 11.5.1.
      - name: Use a recent npm
        run: npm install -g npm@latest

      - name: Check the tag matches package.json
        run: |
          node -e "const v=require('./package.json').version; const t=process.env.GITHUB_REF_NAME.replace(/^v/,''); if (v!==t) { console.error('tag '+t+' != package.json version '+v); process.exit(1) } console.log('version '+v)"

      # El bundle commiteado tiene que ser exactamente el que produce el
      # diccionario: si alguien editó data/es-dictionaries.json y olvidó
      # regenerar lib/client.js, el release falla acá en lugar de publicar un
      # pack que no refleja lo traducido.
      - name: Verify lib/client.js matches the dictionary
        run: |
          npx --yes tsx tools/build-client.ts data/es-dictionaries.json "$RUNNER_TEMP/client.js"
          diff -u lib/client.js "$RUNNER_TEMP/client.js"

      # Sin NODE_AUTH_TOKEN: la autenticación la resuelve el OIDC.
      - name: Publish to npm
        run: npm publish --provenance --access public
